<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Scratch</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🐱</span><strong>Local Scratch</strong></div>
      <div class="project-name" contenteditable="true" aria-label="Project name">My project</div>
      <div class="top-actions">
        <button id="save-button" class="secondary">Save</button>
        <button id="load-button" class="secondary">Load</button>
        <button id="run-button" class="run">▶ Run</button>
        <button id="stop-button" class="stop">■ Stop</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <h2>Blocks</h2>
        <div class="category-tabs" role="tablist" aria-label="Block categories">
          <button class="category active" data-category="motion">Motion</button>
          <button class="category" data-category="looks">Looks</button>
          <button class="category" data-category="control">Control</button>
          <button class="category" data-category="events">Events</button>
        </div>
        <div id="palette" class="palette" aria-label="Block palette"></div>
        <p class="hint">Drag blocks into the script, or click them to add them.</p>
      </aside>

      <section class="scripts-panel">
        <div class="panel-heading"><h2>Code</h2><button id="clear-button" class="text-button">Clear</button></div>
        <div id="script" class="script" aria-label="Script workspace">
          <div class="drop-message">Drop blocks here to build your program</div>
        </div>
      </section>

      <section class="stage-panel">
        <div class="stage-heading"><h2>Stage</h2><span id="status">Ready</span></div>
        <div id="stage" class="stage">
          <div id="sprite" class="sprite" aria-label="Cat sprite">🐱</div>
          <div id="speech" class="speech" hidden></div>
        </div>
        <div class="sprite-controls">
          <label>Sprite <input id="sprite-name" value="Cat"></label>
          <button id="reset-button" class="secondary">Reset position</button>
        </div>
      </section>
    </main>
    <footer>Everything runs locally in your browser. Projects are saved in this browser.</footer>
    <script src="app.js"></script>
  </body>
</html>
